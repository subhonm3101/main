<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: #1a1a2e;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .controls {
            margin-top: 20px;
            color: white;
        }

        .score {
            font-size: 1.5em;
            margin: 15px 0;
            color: #ffd700;
            font-weight: bold;
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            max-width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5em;
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
            }
            
            .game-container {
                padding: 15px;
                margin: 10px;
            }
            
            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Modern Snake</h1>
        <div class="score">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="mobile-controls">
            <button class="control-btn btn-up" onclick="changeDirection(0)">↑</button>
            <button class="control-btn btn-left" onclick="changeDirection(3)">←</button>
            <button class="control-btn btn-right" onclick="changeDirection(1)">→</button>
            <button class="control-btn btn-down" onclick="changeDirection(2)">↓</button>
        </div>
        
        <div class="controls">
            <p>Use arrow keys to control the snake</p>
            <p>Press SPACE to restart game</p>
        </div>
    </div>

    <script>
        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gridSize = 20;
                this.tileCount = this.canvas.width / this.gridSize;
                
                this.reset();
                this.setupEventListeners();
                this.gameLoop();
            }

            reset() {
                this.snake = [
                    {x: 10, y: 10}
                ];
                this.food = this.generateFood();
                this.dx = 1;
                this.dy = 0;
                this.score = 0;
                this.gameOver = false;
                document.getElementById('score').textContent = this.score;
            }

            generateFood() {
                return {
                    x: Math.floor(Math.random() * this.tileCount),
                    y: Math.floor(Math.random() * this.tileCount)
                };
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver && e.code === 'Space') {
                        this.reset();
                        return;
                    }

                    const goingUp = this.dy === -1;
                    const goingDown = this.dy === 1;
                    const goingRight = this.dx === 1;
                    const goingLeft = this.dx === -1;

                    if (e.key === 'ArrowUp' && !goingDown) {
                        this.dx = 0;
                        this.dy = -1;
                    }
                    if (e.key === 'ArrowDown' && !goingUp) {
                        this.dx = 0;
                        this.dy = 1;
                    }
                    if (e.key === 'ArrowLeft' && !goingRight) {
                        this.dx = -1;
                        this.dy = 0;
                    }
                    if (e.key === 'ArrowRight' && !goingLeft) {
                        this.dx = 1;
                        this.dy = 0;
                    }
                });

                // Touch controls for mobile
                let touchStartX = 0;
                let touchStartY = 0;

                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    e.preventDefault();
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    if (!touchStartX || !touchStartY) return;

                    const touchEndX = e.touches[0].clientX;
                    const touchEndY = e.touches[0].clientY;

                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        // Horizontal swipe
                        if (dx > 0 && this.dx !== -1) {
                            this.dx = 1;
                            this.dy = 0;
                        } else if (dx < 0 && this.dx !== 1) {
                            this.dx = -1;
                            this.dy = 0;
                        }
                    } else {
                        // Vertical swipe
                        if (dy > 0 && this.dy !== -1) {
                            this.dx = 0;
                            this.dy = 1;
                        } else if (dy < 0 && this.dy !== 1) {
                            this.dx = 0;
                            this.dy = -1;
                        }
                    }

                    touchStartX = null;
                    touchStartY = null;
                    e.preventDefault();
                });
            }

            changeDirection(direction) {
                if (direction === 0 && this.dy !== 1) { // Up
                    this.dx = 0;
                    this.dy = -1;
                } else if (direction === 1 && this.dx !== -1) { // Right
                    this.dx = 1;
                    this.dy = 0;
                } else if (direction === 2 && this.dy !== -1) { // Down
                    this.dx = 0;
                    this.dy = 1;
                } else if (direction === 3 && this.dx !== 1) { // Left
                    this.dx = -1;
                    this.dy = 0;
                }
            }

            update() {
                if (this.gameOver) return;

                const head = {x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy};

                // Wall collision
                if (head.x < 0 || head.x >= this.tileCount || 
                    head.y < 0 || head.y >= this.tileCount) {
                    this.gameOver = true;
                    return;
                }

                // Self collision
                for (let segment of this.snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        this.gameOver = true;
                        return;
                    }
                }

                this.snake.unshift(head);

                // Food collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    document.getElementById('score').textContent = this.score;
                    this.food = this.generateFood();
                } else {
                    this.snake.pop();
                }
            }

            draw() {
                // Clear canvas with gradient
                const gradient = this.ctx.createLinearGradient(0, 0, this.canvas.width, this.canvas.height);
                gradient.addColorStop(0, '#1a1a2e');
                gradient.addColorStop(1, '#16213e');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw snake with gradient
                this.snake.forEach((segment, index) => {
                    const gradient = this.ctx.createRadialGradient(
                        segment.x * this.gridSize + this.gridSize/2,
                        segment.y * this.gridSize + this.gridSize/2,
                        0,
                        segment.x * this.gridSize + this.gridSize/2,
                        segment.y * this.gridSize + this.gridSize/2,
                        this.gridSize/2
                    );
                    
                    if (index === 0) {
                        // Head
                        gradient.addColorStop(0, '#4CAF50');
                        gradient.addColorStop(1, '#45a049');
                    } else {
                        // Body
                        gradient.addColorStop(0, '#2196F3');
                        gradient.addColorStop(1, '#1976D2');
                    }
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(segment.x * this.gridSize, segment.y * this.gridSize, 
                                    this.gridSize - 2, this.gridSize - 2);
                    
                    // Rounded corners
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    this.ctx.beginPath();
                    this.ctx.arc(segment.x * this.gridSize + this.gridSize/2, 
                                segment.y * this.gridSize + this.gridSize/2, 
                                this.gridSize/3, 0, Math.PI * 2);
                    this.ctx.fill();
                });

                // Draw food with animation
                this.ctx.fillStyle = '#ff4757';
                this.ctx.beginPath();
                this.ctx.arc(this.food.x * this.gridSize + this.gridSize/2,
                            this.food.y * this.gridSize + this.gridSize/2,
                            this.gridSize/2, 0, Math.PI * 2);
                this.ctx.fill();

                // Pulsing effect for food
                const pulse = Math.sin(Date.now() * 0.01) * 2;
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                this.ctx.beginPath();
                this.ctx.arc(this.food.x * this.gridSize + this.gridSize/2,
                            this.food.y * this.gridSize + this.gridSize/2,
                            this.gridSize/4 + pulse, 0, Math.PI * 2);
                this.ctx.fill();

                if (this.gameOver) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    this.ctx.font = '30px Arial';
                    this.ctx.fillStyle = 'white';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('Game Over!', this.canvas.width/2, this.canvas.height/2 - 20);
                    this.ctx.font = '20px Arial';
                    this.ctx.fillText(`Score: ${this.score}`, this.canvas.width/2, this.canvas.height/2 + 20);
                    this.ctx.fillText('Press SPACE to restart', this.canvas.width/2, this.canvas.height/2 + 50);
                }
            }

            gameLoop() {
                this.update();
                this.draw();
                setTimeout(() => this.gameLoop(), 100);
            }
        }

        // Initialize game when page loads
        window.addEventListener('load', () => {
            new SnakeGame();
        });

        // Global function for mobile controls
        function changeDirection(direction) {
            if (window.snakeGame) {
                window.snakeGame.changeDirection(direction);
            }
        }

        // Make game instance globally available for mobile controls
        window.addEventListener('load', () => {
            window.snakeGame = new SnakeGame();
        });
    </script>
</body>
</html>
